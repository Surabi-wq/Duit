name: Duit Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Give APK the product filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Duit-0.1.0.apk
          sha256sum dist/Duit-0.1.0.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Duit-0.1.0-Release
          path: dist/Duit-0.1.0.apk
          if-no-files-found: error
          retention-days: 30
