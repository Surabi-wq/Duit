name: Duit Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK licenses and install packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build Release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Give APK the product filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Duit-1.3.1.apk
          sha256sum dist/Duit-1.3.1.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Duit-1.3.1-Release
          path: dist/Duit-1.3.1.apk
          if-no-files-found: error
          retention-days: 30
